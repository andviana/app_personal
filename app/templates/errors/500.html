{% extends "base.html" %}

{% block title %}500 - Erro Interno{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4">
    <div class="mb-6 w-16 h-16 rounded-2xl bg-danger/10 flex items-center justify-center text-danger">
        <i class="ph-bold ph-warning-circle text-3xl"></i>
    </div>

    <h1 class="text-6xl font-black text-text-heading mb-2 tracking-tighter">500</h1>
    <h2 class="text-lg font-semibold text-text-heading mb-10">Erro no servidor</h2>

    <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="window.location.reload()" class="btn-primary btn-md">
            <i class="ph-bold ph-arrows-clockwise text-base"></i> Repetir
        </button>
        <a href="{{ url_for('main.index') }}" class="btn-secondary btn-md">
            <i class="ph-bold ph-house text-base"></i> Início
        </a>
    </div>
</div>
{% endblock %}
