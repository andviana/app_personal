{% extends "base.html" %}

{% block title %}Alterar Senha - AppPessoal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto flex flex-col gap-8">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('settings.index') }}" class="w-11 h-11 flex items-center justify-center bg-[#313338] text-text-muted hover:text-[#747f8d] rounded-xl transition-standard shadow-sm border border-discord-400 hover:border-[#747f8d]/50">
            <i class="ph-bold ph-arrow-left text-xl"></i>
        </a>
        <div class="flex flex-col gap-1">
            <h1 class="text-3xl font-black text-text-heading tracking-tight flex items-center gap-3">
                <i class="ph-bold ph-key text-[#747f8d]"></i> Segurança
            </h1>
        </div>
    </div>

    <form action="{{ url_for('settings.alterar_senha') }}" method="POST" class="bg-discord-200 border border-discord-400 rounded-3xl p-8 md:p-10 shadow-sm flex flex-col gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Senha Atual -->
        <div class="flex flex-col gap-2">
            <label for="senha_atual" class="text-xs font-bold uppercase tracking-widest text-text-muted">Senha Atual</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                    <i class="ph-bold ph-key"></i>
                </div>
                <input type="password" id="senha_atual" name="senha_atual" required
                       class="w-full px-12 h-12 bg-[#1e1f22] border-none text-text-normal rounded-xl focus:outline-none focus:ring-2 focus:ring-[#747f8d] transition-standard font-semibold placeholder:text-text-muted"
                       placeholder="••••••••">
            </div>
        </div>

        <div class="h-px bg-discord-400 my-2"></div>

        <!-- Nova Senha -->
        <div class="flex flex-col gap-2">
            <label for="nova_senha" class="text-xs font-bold uppercase tracking-widest text-text-muted">Nova Senha</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                    <i class="ph-bold ph-lock"></i>
                </div>
                <input type="password" id="nova_senha" name="nova_senha" required
                       class="w-full px-12 h-12 bg-[#1e1f22] border-none text-text-normal rounded-xl focus:outline-none focus:ring-2 focus:ring-[#747f8d] transition-standard font-semibold placeholder:text-text-muted"
                       placeholder="Mínimo 8 caracteres">
            </div>
        </div>

        <!-- Confirmar Nova Senha -->
        <div class="flex flex-col gap-2">
            <label for="confirmar_senha" class="text-xs font-bold uppercase tracking-widest text-text-muted">Confirmar Nova Senha</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                    <i class="ph-bold ph-lock-key"></i>
                </div>
                <input type="password" id="confirmar_senha" name="confirmar_senha" required
                       class="w-full px-12 h-12 bg-[#1e1f22] border-none text-text-normal rounded-xl focus:outline-none focus:ring-2 focus:ring-[#747f8d] transition-standard font-semibold placeholder:text-text-muted"
                       placeholder="Repita a nova senha">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-4 pt-6 justify-end">
            <a href="{{ url_for('settings.index') }}"
                class="btn-secondary btn-md font-black tracking-widest text-[11px] h-12 px-8 flex items-center justify-center gap-2 opacity-70 hover:opacity-100 transition-all w-full md:w-auto order-2 md:order-1">
                <i class="ph-bold ph-x"></i> CANCELAR
            </a>
            <button type="submit"
                class="btn-primary btn-md group !bg-[#747f8d] !text-white !shadow-[#747f8d]/20 font-black tracking-widest text-[11px] h-12 px-10 flex items-center justify-center gap-2 transition-all hover:scale-[1.02] active:scale-[0.98] w-full md:w-auto order-1 md:order-2">
                <i class="ph-bold ph-check"></i> SALVAR
            </button>
        </div>

    </form>
</div>
{% endblock %}
