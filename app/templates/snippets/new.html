{% extends "base.html" %}

{% block title %}Novo Snippet - AppPessoal{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
<style>
    /* Custom EasyMDE Dark Theme */
    .EasyMDEContainer .editor-toolbar {
        background: #2b2d31 !important;
        border: 1px solid #1e1f22 !important;
        border-top-left-radius: 12px !important;
        border-top-right-radius: 12px !important;
        opacity: 1 !important;
        padding: 8px !important;
    }
    .EasyMDEContainer .editor-toolbar button {
        color: #b5bac1 !important;
        border-radius: 6px !important;
        transition: all 0.2s ease !important;
    }
    .EasyMDEContainer .editor-toolbar button:hover, 
    .EasyMDEContainer .editor-toolbar button.active {
        background: #35373c !important;
        color: #fff !important;
    }
    .EasyMDEContainer .editor-toolbar i.separator {
        border-left: 1px solid #1e1f22 !important;
        border-right: none !important;
    }
    .EasyMDEContainer .CodeMirror {
        background: #1e1f22 !important;
        color: #dbdee1 !important;
        border: 1px solid #1e1f22 !important;
        border-bottom-left-radius: 12px !important;
        border-bottom-right-radius: 12px !important;
        font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
        font-size: 14px !important;
        padding: 12px !important;
    }
    .EasyMDEContainer .CodeMirror-cursor {
        border-left: 1px solid #4f46e5 !important;
    }
    .EasyMDEContainer .editor-preview-side,
    .EasyMDEContainer .editor-preview {
        background: #313338 !important;
        color: #dbdee1 !important;
        border: 1px solid #1e1f22 !important;
    }
    /* Markdown Preview Styles */
    .editor-preview h1, .editor-preview h2, .editor-preview h3 { color: #f2f3f5; font-weight: 800; margin-top: 1em; margin-bottom: 0.5em; }
    .editor-preview h1 { font-size: 1.5em; border-bottom: 1px solid #3f4147; padding-bottom: 0.3em; }
    .editor-preview h2 { font-size: 1.3em; }
    .editor-preview code { background: #1e1f22; padding: 2px 4px; border-radius: 4px; color: #4f46e5; font-family: monospace; }
    .editor-preview pre { background: #1e1f22; padding: 16px; border-radius: 8px; border: 1px solid #3f4147; overflow-x: auto; }
    .editor-preview blockquote { border-left: 4px solid #4e5058; padding-left: 16px; color: #b5bac1; font-style: italic; }
    .editor-preview a { color: #00a8fc; text-decoration: none; }
    .editor-preview a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto flex flex-col gap-8">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('snippets.index') }}" class="w-11 h-11 flex items-center justify-center bg-surface text-text-muted hover:text-primary rounded-xl transition-standard shadow-sm border border-slate-200 hover:border-primary/50">
            <i class="ph-bold ph-arrow-left text-xl"></i>
        </a>
        <div class="flex flex-col gap-1">
            <h1 class="text-2xl md:text-3xl font-bold text-text-heading tracking-tight flex items-center gap-3">
                <i class="ph-bold ph-code text-primary"></i> Novo Snippet
            </h1>
        </div>
    </div>

    <form action="{{ url_for('snippets.add') }}" method="POST" class="bg-surface border border-slate-200 rounded-3xl p-8 md:p-10 shadow-sm flex flex-col gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- Título -->
        <div class="flex flex-col gap-2">
            <label for="titulo" class="form-label">Título do Snippet <span class="text-danger">*</span></label>
            <input type="text" id="titulo" name="titulo" required
                   class="w-full px-4 h-12 bg-surface-sunken border-none rounded-xl focus:ring-2 focus:ring-primary text-text-normal font-semibold placeholder:text-text-muted transition-standard"
                   placeholder="Ex: Conexão com Banco em Python">
        </div>

        <!-- Descrição -->
        <div class="flex flex-col gap-2">
            <label for="descricao" class="form-label">Descrição (Opcional)</label>
            <input type="text" id="descricao" name="descricao"
                   class="w-full px-4 h-12 bg-surface-sunken border-none rounded-xl focus:ring-2 focus:ring-primary text-text-normal font-semibold placeholder:text-text-muted transition-standard"
                   placeholder="Breve resumo sobre o que este snippet faz">
        </div>

        <!-- Conteúdo Markdown -->
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1">
                <label for="conteudo" class="form-label">Conteúdo Markdown <span class="text-danger">*</span></label>
                <div class="flex gap-4">
                    <span class="text-xs font-semibold text-primary flex items-center gap-1">
                        <i class="ph-bold ph-info"></i> Use ```linguagem para código
                    </span>
                </div>
            </div>
            <textarea id="conteudo" name="conteudo" rows="12"
                      class="w-full p-4 bg-surface-sunken border-none rounded-xl focus:ring-2 focus:ring-primary text-text-normal font-mono text-sm leading-relaxed placeholder:text-text-muted transition-standard"
                      placeholder="# Exemplo\n\n```python\nprint('Olá Mundo')\n```"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-4 pt-6 justify-end">
            <a href="{{ url_for('snippets.index') }}" class="btn-secondary btn-lg w-full md:w-auto order-2 md:order-1">
                <i class="ph-bold ph-x"></i> Cancelar
            </a>
            <button type="submit" class="btn-primary btn-lg w-full md:w-auto order-1 md:order-2">
                <i class="ph-bold ph-check"></i> Salvar
            </button>
        </div>

    </form>

</div>
{% endblock %}

{% block scripts_extra %}
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const easyMDE = new EasyMDE({
            element: document.getElementById('conteudo'),
            forceSync: true,
            spellChecker: false,
            autosave: {
                enabled: true,
                uniqueId: "snippet_new_content",
                delay: 1000,
            },
            toolbar: [
                "bold", "italic", "heading", "|", 
                "quote", "unordered-list", "ordered-list", "|", 
                "link", "image", "table", "|", 
                "code", 
                {
                    name: "code-block",
                    action: function(editor) {
                        const cm = editor.codemirror;
                        const selection = cm.getSelection();
                        const text = selection || "seu_codigo_aqui";
                        cm.replaceSelection("```\n" + text + "\n```");
                    },
                    className: "fa fa-file-code-o",
                    title: "Bloco de Código",
                },
                "|",
                "preview", "side-by-side", "fullscreen", "|", 
                "guide"
            ],
            placeholder: "Digite seu markdown aqui...",
            status: ["lines", "words", "cursor"],
            minHeight: "300px",
            renderingConfig: {
                singleLineBreaks: false,
                codeSyntaxHighlighting: true,
            },
        });
    });
</script>
{% endblock %}
