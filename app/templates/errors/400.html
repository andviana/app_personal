{% extends "base.html" %}

{% block title %}400 - Requisição Inválida{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4">
    <div class="mb-6 w-16 h-16 rounded-2xl bg-surface-sunken flex items-center justify-center text-text-muted">
        <i class="ph-bold ph-bug text-3xl"></i>
    </div>

    <h1 class="text-6xl font-black text-text-heading mb-2 tracking-tighter">400</h1>
    <h2 class="text-lg font-semibold text-text-heading mb-10">Requisição inválida</h2>

    <div class="flex flex-col sm:flex-row gap-3">
        <a href="{{ url_for('main.index') }}" class="btn-primary btn-md">
            <i class="ph-bold ph-house text-base"></i> Início
        </a>
        <button onclick="window.history.back()" class="btn-secondary btn-md">
            <i class="ph-bold ph-arrow-left text-base"></i> Voltar
        </button>
    </div>
</div>
{% endblock %}
