{% extends "base.html" %}

{% block title %}Novo Snippet - AppPessoal{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto flex flex-col gap-8">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('snippets.index') }}" class="w-11 h-11 flex items-center justify-center bg-[#313338] text-text-muted hover:text-text-normal rounded-xl transition-standard shadow-sm border border-discord-400">
            <i class="ph-bold ph-arrow-left text-xl"></i>
        </a>
        <div class="flex flex-col gap-1">
            <h1 class="text-3xl font-black text-text-heading tracking-tight flex items-center gap-3">
                <i class="ph-bold ph-code text-[#9a55f3]"></i> Novo Snippet
            </h1>
            <p class="text-[11px] font-bold text-text-muted/50 uppercase tracking-[0.2em]">
                Criar novo bloco de código
            </p>
        </div>
    </div>

    <form action="{{ url_for('snippets.add') }}" method="POST" class="bg-discord-200 border border-discord-400 rounded-3xl p-8 md:p-10 shadow-sm flex flex-col gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- Título -->
        <div class="flex flex-col gap-2">
            <label for="titulo" class="text-xs font-bold uppercase tracking-widest text-text-muted">Título do Snippet <span class="text-danger">*</span></label>
            <input type="text" id="titulo" name="titulo" required
                   class="w-full px-4 h-12 bg-[#1e1f22] border-none rounded-xl focus:ring-2 focus:ring-primary-DEFAULT text-text-normal font-semibold placeholder:text-text-muted transition-standard"
                   placeholder="Ex: Conexão com Banco em Python">
        </div>

        <!-- Descrição -->
        <div class="flex flex-col gap-2">
            <label for="descricao" class="text-xs font-bold uppercase tracking-widest text-text-muted">Descrição (Opcional)</label>
            <input type="text" id="descricao" name="descricao"
                   class="w-full px-4 h-12 bg-[#1e1f22] border-none rounded-xl focus:ring-2 focus:ring-primary-DEFAULT text-text-normal font-semibold placeholder:text-text-muted transition-standard"
                   placeholder="Breve resumo sobre o que este snippet faz">
        </div>

        <!-- Conteúdo Markdown -->
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1">
                <label for="conteudo" class="text-xs font-bold uppercase tracking-widest text-text-muted">Conteúdo Markdown <span class="text-danger">*</span></label>
                <div class="flex gap-4">
                    <span class="text-[10px] font-bold text-primary-DEFAULT uppercase tracking-widest flex items-center gap-1">
                        <i class="ph-bold ph-info"></i> Use ```linguagem para código
                    </span>
                </div>
            </div>
            <textarea id="conteudo" name="conteudo" required rows="12"
                      class="w-full p-4 bg-[#1e1f22] border-none rounded-xl focus:ring-2 focus:ring-primary-DEFAULT text-text-normal font-mono text-sm leading-relaxed placeholder:text-text-muted transition-standard"
                      placeholder="# Exemplo\n\n```python\nprint('Olá Mundo')\n```"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-3 pt-4">
            <a href="{{ url_for('snippets.index') }}" class="btn-secondary btn-lg flex-1 md:flex-none md:w-40">
                Cancelar
            </a>
            <button type="submit" class="btn-primary btn-lg flex-1">
                <i class="ph-bold ph-check"></i> Salvar Snippet
            </button>
        </div>

    </form>

    <!-- Markdown Hint -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="p-6 bg-discord-200 border border-discord-400 rounded-2xl">
            <h4 class="text-xs font-bold uppercase tracking-widest text-text-muted mb-2">Títulos</h4>
            <code class="text-xs text-primary-DEFAULT font-mono"># H1, ## H2, ### H3</code>
        </div>
        <div class="p-6 bg-discord-200 border border-discord-400 rounded-2xl">
            <h4 class="text-xs font-bold uppercase tracking-widest text-text-muted mb-2">Citações</h4>
            <code class="text-xs text-primary-DEFAULT font-mono">> Sua citação aqui</code>
        </div>
        <div class="p-6 bg-discord-200 border border-discord-400 rounded-2xl">
            <h4 class="text-xs font-bold uppercase tracking-widest text-text-muted mb-2">Código</h4>
            <code class="text-xs text-primary-DEFAULT font-mono">```python\n...\n```</code>
        </div>
    </div>
</div>
{% endblock %}
