{% extends "base.html" %}

{% block title %}500 - Erro Interno{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4">
    <div class="mb-6 text-text-muted">
        <i class="ph-bold ph-sketch-logo text-6xl"></i>
    </div>

    <h1 class="text-6xl font-black text-text-heading mb-2 tracking-tighter">500</h1>
    <h2 class="text-lg md:text-xl font-extrabold text-text-heading tracking-wide mb-10 uppercase">ERRO NO SERVIDOR</h2>

    <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="window.location.reload()" class="btn-primary btn-md uppercase tracking-widest text-[11px] font-black h-11 px-6 flex items-center justify-center gap-2">
            <i class="ph-bold ph-arrows-clockwise text-base"></i> REPETIR
        </button>
        <a href="{{ url_for('main.index') }}" class="btn-secondary btn-md uppercase tracking-widest text-[11px] font-black h-11 px-6 flex items-center justify-center gap-2">
            <i class="ph-bold ph-house text-base"></i> INÍCIO
        </a>
    </div>
</div>
{% endblock %}
