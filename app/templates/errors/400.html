{% extends "base.html" %}

{% block title %}400 - Requisição Inválida{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4">
    <div class="relative mb-8">
        <div class="w-32 h-32 bg-discord-200 border-4 border-discord-400 rounded-full flex items-center justify-center z-10">
            <i class="ph-bold ph-bug text-6xl text-text-muted"></i>
        </div>
        <div class="absolute -top-1 -right-1 w-10 h-10 bg-danger rounded-full flex items-center justify-center z-20">
            <i class="ph-bold ph-x text-xl text-white"></i>
        </div>
    </div>

    <h1 class="text-6xl font-black text-text-heading mb-4 tracking-tighter">400</h1>
    <h2 class="text-2xl font-bold text-text-heading mb-6">Ops! Algo está errado na requisição</h2>
    
    <p class="max-w-md text-text-muted text-lg mb-10 leading-relaxed">
        O servidor não conseguiu processar sua solicitação. Verifique se os dados enviados estão corretos.
    </p>

    <div class="flex flex-col sm:flex-row gap-4">
        <a href="{{ url_for('main.index') }}" class="px-8 py-4 bg-primary-DEFAULT text-white font-bold rounded-xl hover:bg-primary-hover active:scale-95 transition-standard flex items-center gap-2">
            <i class="ph-bold ph-house"></i> Ir para o Dashboard
        </a>
    </div>
</div>
{% endblock %}
