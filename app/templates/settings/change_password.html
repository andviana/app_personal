{% extends "base.html" %}

{% block title %}Alterar Senha - AppPessoal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto flex flex-col gap-8">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('settings.index') }}" class="w-11 h-11 flex items-center justify-center bg-surface text-text-muted hover:text-primary rounded-xl transition-standard shadow-sm border border-slate-200 hover:border-primary/50">
            <i class="ph-bold ph-arrow-left text-xl"></i>
        </a>
        <div class="flex flex-col gap-1">
            <h1 class="text-2xl md:text-3xl font-bold text-text-heading tracking-tight flex items-center gap-3">
                <i class="ph-bold ph-key text-primary"></i> Segurança
            </h1>
        </div>
    </div>

    <form action="{{ url_for('settings.alterar_senha') }}" method="POST" class="bg-surface border border-slate-200 rounded-2xl p-8 md:p-10 shadow-sm flex flex-col gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Senha Atual -->
        <div class="flex flex-col gap-2">
            <label for="senha_atual" class="form-label">Senha atual</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                    <i class="ph-bold ph-key"></i>
                </div>
                <input type="password" id="senha_atual" name="senha_atual" required
                       class="form-input !pl-12 !h-12"
                       placeholder="••••••••">
            </div>
        </div>

        <div class="h-px bg-slate-200 my-2"></div>

        <!-- Nova Senha -->
        <div class="flex flex-col gap-2">
            <label for="nova_senha" class="form-label">Nova senha</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                    <i class="ph-bold ph-lock"></i>
                </div>
                <input type="password" id="nova_senha" name="nova_senha" required
                       class="form-input !pl-12 !h-12"
                       placeholder="Mínimo 8 caracteres">
            </div>
        </div>

        <!-- Confirmar Nova Senha -->
        <div class="flex flex-col gap-2">
            <label for="confirmar_senha" class="form-label">Confirmar nova senha</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                    <i class="ph-bold ph-lock-key"></i>
                </div>
                <input type="password" id="confirmar_senha" name="confirmar_senha" required
                       class="form-input !pl-12 !h-12"
                       placeholder="Repita a nova senha">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-3 pt-4 justify-end">
            <a href="{{ url_for('settings.index') }}" class="btn-secondary btn-lg w-full md:w-auto order-2 md:order-1">
                <i class="ph-bold ph-x"></i> Cancelar
            </a>
            <button type="submit" class="btn-primary btn-lg w-full md:w-auto order-1 md:order-2">
                <i class="ph-bold ph-check"></i> Salvar
            </button>
        </div>

    </form>
</div>
{% endblock %}
