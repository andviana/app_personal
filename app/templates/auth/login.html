{% extends "base.html" %}

{% block title %}Login - AppPessoal{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-[#313338] p-10 rounded-[2.5rem] shadow-xl border border-discord-400">
        <div>
            <div
                class="mx-auto h-16 w-16 bg-primary-DEFAULT rounded-3xl flex items-center justify-center shadow-lg shadow-primary-DEFAULT/20">
                <i class="ph-fill ph-lock-key text-white text-3xl"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-text-heading tracking-tight">DayLog</h2>
        </div>

        <form class="mt-8 space-y-6" action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="px-4 py-3 bg-danger/10 border border-danger/20 rounded-xl text-danger text-sm font-semibold flex items-center gap-3 animate-pulse">
                            <i class="ph-bold ph-warning-circle text-lg"></i>
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <div class="rounded-2xl space-y-4">
                <div class="flex flex-col gap-2">
                    <label for="username"
                        class="text-[10px] font-bold uppercase tracking-widest text-text-muted ml-1">Usuário</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                            <i class="ph-bold ph-user text-lg"></i>
                        </div>
                        <input id="username" name="username" type="text" required
                            class="appearance-none relative block w-full px-12 h-12 bg-[#1e1f22] border-none text-text-normal rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-DEFAULT transition-standard font-semibold placeholder:text-text-muted"
                            placeholder="nome de usuário">
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password"
                        class="text-[10px] font-bold uppercase tracking-widest text-text-muted ml-1">Senha</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
                            <i class="ph-bold ph-lock-key text-lg"></i>
                        </div>
                        <input id="password" name="password" type="password" required
                            class="appearance-none relative block w-full px-12 h-12 bg-[#1e1f22] border-none text-text-normal rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-DEFAULT transition-standard font-semibold placeholder:text-text-muted"
                            placeholder="sua senha">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox"
                        class="h-5 w-5 bg-[#1e1f22] border border-discord-400 text-primary-DEFAULT focus:ring-primary-DEFAULT rounded transition-standard">
                    <label for="remember" class="ml-2 block text-sm text-text-normal tracking-wide font-medium">
                        Lembrar-me
                    </label>
                </div>
            </div>

            <div>
                <button type="submit" class="btn-primary btn-lg w-full uppercase tracking-widest">
                    Acessar Conta
                </button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
