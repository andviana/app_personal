{% extends "base.html" %}

{% block title %}Login - AppPessoal{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-surface p-10 rounded-[2.5rem] border border-slate-200 shadow-xl">
        <div>
            <div
                class="mx-auto h-16 w-16 bg-primary-600 rounded-3xl flex items-center justify-center shadow-lg shadow-primary-600/20">
                <i class="ph-fill ph-lock-key text-white text-3xl"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-black text-slate-900 uppercase tracking-tight">DayLog</h2>

        </div>

        <form class="mt-8 space-y-6" action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
            <div class="rounded-2xl space-y-4">
                <div class="flex flex-col gap-2">
                    <label for="username"
                        class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Usuário</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-user"></i>
                        </div>
                        <input id="username" name="username" type="text" required
                            class="appearance-none relative block w-full px-12 py-4 bg-slate-50 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-transparent transition-standard font-bold"
                            placeholder="nome de usuário">
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password"
                        class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Senha</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="ph ph-lock"></i>
                        </div>
                        <input id="password" name="password" type="password" required
                            class="appearance-none relative block w-full px-12 py-4 bg-slate-50 border border-slate-200 placeholder-slate-400 text-slate-900 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-transparent transition-standard font-bold"
                            placeholder="sua senha">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember" name="remember" type="checkbox"
                        class="h-5 w-5 text-primary-600 focus:ring-primary-600 border-slate-300 rounded-lg transition-standard">
                    <label for="remember" class="ml-2 block text-sm text-slate-600 tracking-wide">
                        Lembrar-me
                    </label>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-5 px-4 border border-transparent text-sm font-black uppercase tracking-widest rounded-2xl text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-600 transition-standard shadow-lg shadow-primary-600/30 active:scale-95">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="ph-bold ph-sign-in text-primary-200 group-hover:text-white transition-standard"></i>
                    </span>
                    Acessar Conta
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
