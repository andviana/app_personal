{% extends "base.html" %}

{% block title %}404 - Não Encontrada{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4">
    <div class="mb-6 text-text-muted">
        <i class="ph-bold ph-magnifying-glass text-6xl"></i>
    </div>

    <h1 class="text-6xl font-black text-text-heading mb-2 tracking-tighter">404</h1>
    <h2 class="text-lg md:text-xl font-extrabold text-text-heading tracking-wide mb-10 uppercase">PÁGINA NÃO ENCONTRADA</h2>

    <div class="flex flex-col sm:flex-row gap-3">
        <a href="{{ url_for('main.index') }}" class="btn-primary btn-md uppercase tracking-widest text-[11px] font-black h-11 px-6 flex items-center justify-center gap-2">
            <i class="ph-bold ph-house text-base"></i> INÍCIO
        </a>
        <button onclick="window.history.back()" class="btn-secondary btn-md uppercase tracking-widest text-[11px] font-black h-11 px-6 flex items-center justify-center gap-2">
            <i class="ph-bold ph-arrow-left text-base"></i> VOLTAR
        </button>
    </div>
</div>
{% endblock %}
