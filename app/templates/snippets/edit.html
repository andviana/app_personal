{% extends "base.html" %}

{% block title %}Editar Snippet - {{ snippet.titulo }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto flex flex-col gap-8">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('snippets.index') }}" class="w-11 h-11 flex items-center justify-center bg-[#313338] text-text-muted hover:text-[#9a55f3] rounded-xl transition-standard shadow-sm border border-discord-400 hover:border-[#9a55f3]/50">
            <i class="ph-bold ph-arrow-left text-xl"></i>
        </a>
        <div class="flex flex-col gap-1">
            <h1 class="text-3xl font-black text-text-heading tracking-tight flex items-center gap-3">
                <i class="ph-bold ph-code text-[#9a55f3]"></i> Editar Snippet
            </h1>
            <p class="text-[11px] font-bold text-text-muted/50 uppercase tracking-[0.2em]">
                Modificar bloco de código existente
            </p>
        </div>
    </div>

    <form action="{{ url_for('snippets.edit', id=snippet.id) }}" method="POST" class="bg-discord-200 border border-discord-400 rounded-3xl p-8 md:p-10 shadow-sm flex flex-col gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- Título -->
        <div class="flex flex-col gap-2">
            <label for="titulo" class="text-xs font-bold uppercase tracking-widest text-text-muted">Título do Snippet <span class="text-danger">*</span></label>
            <input type="text" id="titulo" name="titulo" required value="{{ snippet.titulo }}"
                   class="w-full px-4 h-12 bg-[#1e1f22] border-none rounded-xl focus:ring-2 focus:ring-[#9a55f3] text-text-normal font-semibold placeholder:text-text-muted transition-standard"
                   placeholder="Ex: Conexão com Banco em Python">
        </div>

        <!-- Descrição -->
        <div class="flex flex-col gap-2">
            <label for="descricao" class="text-xs font-bold uppercase tracking-widest text-text-muted">Descrição (Opcional)</label>
            <input type="text" id="descricao" name="descricao" value="{{ snippet.descricao or '' }}"
                   class="w-full px-4 h-12 bg-[#1e1f22] border-none rounded-xl focus:ring-2 focus:ring-[#9a55f3] text-text-normal font-semibold placeholder:text-text-muted transition-standard"
                   placeholder="Breve resumo sobre o que este snippet faz">
        </div>

        <!-- Conteúdo Markdown -->
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1">
                <label for="conteudo" class="text-xs font-bold uppercase tracking-widest text-text-muted">Conteúdo Markdown <span class="text-danger">*</span></label>
                <div class="flex gap-4">
                    <span class="text-[10px] font-bold text-[#9a55f3] uppercase tracking-widest flex items-center gap-1">
                        <i class="ph-bold ph-info"></i> Use ```linguagem para código
                    </span>
                </div>
            </div>
            <textarea id="conteudo" name="conteudo" required rows="12"
                      class="w-full p-4 bg-[#1e1f22] border-none rounded-xl focus:ring-2 focus:ring-[#9a55f3] text-text-normal font-mono text-sm leading-relaxed placeholder:text-text-muted transition-standard"
                      placeholder="# Exemplo\n\n```python\nprint('Olá Mundo')\n```">{{ snippet.conteudo }}</textarea>
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-3 pt-4">
            <a href="{{ url_for('snippets.index') }}" class="btn-secondary btn-lg flex-1 md:flex-none md:w-40">
                Cancelar
            </a>
            <button type="submit" class="btn-primary btn-lg flex-1 !bg-[#9a55f3] !text-white !shadow-[#9a55f3]/20">
                <i class="ph-bold ph-check"></i> Salvar Alterações
            </button>
        </div>

    </form>
</div>
{% endblock %}
