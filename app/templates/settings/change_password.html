{% extends "base.html" %}

{% block title %}Alterar Senha - AppPessoal{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto flex flex-col gap-8">
    <div class="flex items-center gap-4">
        <a href="{{ url_for('settings.index') }}" class="p-3 bg-white border border-slate-200 text-slate-400 hover:text-primary-600 rounded-2xl transition-standard shadow-sm">
            <i class="ph ph-arrow-left text-xl"></i>
        </a>
        <div>
            <h1 class="text-3xl font-black tracking-tight text-slate-900 uppercase">Alterar Senha</h1>
            <p class="text-slate-500 font-medium">Mantenha sua conta segura atualizando sua senha.</p>
        </div>
    </div>

    <form action="{{ url_for('settings.alterar_senha') }}" method="POST" class="bg-surface border border-slate-200 rounded-[2.5rem] p-8 md:p-12 shadow-sm flex flex-col gap-6">
        <!-- Senha Atual -->
        <div class="flex flex-col gap-2">
            <label for="senha_atual" class="text-xs font-black uppercase tracking-widest text-slate-400">Senha Atual</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i class="ph ph-key"></i>
                </div>
                <input type="password" id="senha_atual" name="senha_atual" required
                       class="w-full px-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none transition-standard font-bold"
                       placeholder="••••••••">
            </div>
        </div>

        <div class="h-px bg-slate-100 my-2"></div>

        <!-- Nova Senha -->
        <div class="flex flex-col gap-2">
            <label for="nova_senha" class="text-xs font-black uppercase tracking-widest text-slate-400">Nova Senha</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i class="ph ph-lock"></i>
                </div>
                <input type="password" id="nova_senha" name="nova_senha" required
                       class="w-full px-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none transition-standard font-bold"
                       placeholder="Mínimo 8 caracteres">
            </div>
        </div>

        <!-- Confirmar Nova Senha -->
        <div class="flex flex-col gap-2">
            <label for="confirmar_senha" class="text-xs font-black uppercase tracking-widest text-slate-400">Confirmar Nova Senha</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i class="ph ph-lock-key"></i>
                </div>
                <input type="password" id="confirmar_senha" name="confirmar_senha" required
                       class="w-full px-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-600 focus:border-transparent outline-none transition-standard font-bold"
                       placeholder="Repita a nova senha">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-4 pt-6">
            <button type="submit" class="flex-grow py-5 bg-primary-600 text-white rounded-2xl font-bold uppercase tracking-widest hover:bg-primary-700 active:scale-95 transition-standard shadow-lg shadow-primary-600/30 flex items-center justify-center gap-2">
                <i class="ph-bold ph-check"></i> Atualizar Senha
            </button>
            <a href="{{ url_for('settings.index') }}" class="py-5 px-10 bg-slate-100 text-slate-600 rounded-2xl font-bold uppercase tracking-widest hover:bg-slate-200 transition-standard text-center">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
